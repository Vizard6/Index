<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gold & Silver Prices India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .price-card {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .price-display { font-size: 2.4em; font-weight: bold; color: #667eea; margin: 10px 0; }
        .refresh-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
        }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Live Gold & Silver Prices India</h1>
        <p>Real-time Rates • Updated every 10 minutes</p>

        <div class="price-grid">
            <div class="price-card">
                <h2>Gold 24K (10g)</h2>
                <div id="gold24" class="price-display">Loading...</div>
            </div>
            <div class="price-card">
                <h2>Gold 22K (10g)</h2>
                <div id="gold22" class="price-display">Loading...</div>
            </div>
            <div class="price-card">
                <h2>Silver (1kg)</h2>
                <div id="silver" class="price-display">Loading...</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="fetchPrices()">🔄 Refresh Now</button>
        <div id="update-time"></div>
    </div>

    <script>
        async function fetchPrices() {
            const els = {
                gold24: document.getElementById('gold24'),
                gold22: document.getElementById('gold22'),
                silver: document.getElementById('silver')
            };

            Object.values(els).forEach(el => el.textContent = "Updating...");

            try {
                // Using a more stable public source
                const response = await fetch('https://api.allorigins.win/get?url=' + 
                    encodeURIComponent('https://www.goodreturns.in/gold-rates/'));
                
                const result = await response.json();
                const html = result.contents;

                // Extract prices
                const goldMatch = html.match(/24K Gold.*?(₹[\d,]+)/i);
                const silverMatch = html.match(/Silver.*?(₹[\d,]+)/i);

                if (goldMatch) {
                    let price24 = goldMatch[1].replace(/[^0-9]/g, '');
                    els.gold24.textContent = `₹${parseInt(price24).toLocaleString('en-IN')}`;
                    els.gold22.textContent = `₹${Math.round(parseInt(price24) * 22 / 24).toLocaleString('en-IN')}`;
                }

                if (silverMatch) {
                    let silverPrice = silverMatch[1].replace(/[^0-9]/g, '');
                    els.silver.textContent = `₹${parseInt(silverPrice).toLocaleString('en-IN')}`;
                }

                document.getElementById('update-time').textContent = `Last updated: ${new Date().toLocaleTimeString('en-IN')}`;

            } catch (e) {
                console.error(e);
                Object.values(els).forEach(el => {
                    el.textContent = "Data unavailable";
                    el.classList.add('error');
                });
            }
        }

        window.onload = fetchPrices;
        setInterval(fetchPrices, 600000);
    </script>
</body>
</html>
