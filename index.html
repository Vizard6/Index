<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gold & Silver Prices India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2.5em; margin-bottom: 10px; text-align: center; }
        .subtitle { text-align: center; margin-bottom: 30px; opacity: 0.9; }
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .price-card {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 35px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .price-display {
            font-size: 2.6em;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }
        .refresh-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
        }
        #update-time { text-align: center; margin: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Live Gold & Silver Prices India</h1>
        <p class="subtitle">Real-time 22K, 24K Gold & Silver Rates</p>

        <div class="price-grid">
            <div class="price-card">
                <h2>Gold 24K</h2>
                <p>Per 10 Grams</p>
                <div id="gold24" class="price-display">Loading...</div>
            </div>
            <div class="price-card">
                <h2>Gold 22K</h2>
                <p>Per 10 Grams</p>
                <div id="gold22" class="price-display">Loading...</div>
            </div>
            <div class="price-card">
                <h2>Silver</h2>
                <p>Per 1 Kilogram</p>
                <div id="silver" class="price-display">Loading...</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="fetchPrices()">🔄 Refresh Prices Now</button>
        <div id="update-time">Loading latest prices...</div>
    </div>

    <script>
        async function fetchPrices() {
            const els = {
                gold24: document.getElementById('gold24'),
                gold22: document.getElementById('gold22'),
                silver: document.getElementById('silver')
            };

            // Show updating
            Object.values(els).forEach(el => {
                if (el) el.textContent = "Updating...";
            });

            try {
                const proxyUrl = 'https://api.allorigins.win/get?url=';
                const targetUrl = encodeURIComponent('https://groww.in/gold-rates');
                
                const response = await fetch(proxyUrl + targetUrl);
                const result = await response.json();
                const html = result.contents;

                // Extract prices
                const gold24Match = html.match(/24K.*?₹([\d,]+)/i);
                const silverMatch = html.match(/Silver.*?₹([\d,]+)/i);

                if (gold24Match && els.gold24) {
                    let price = gold24Match[1].replace(/,/g, '');
                    els.gold24.textContent = `₹${parseInt(price).toLocaleString('en-IN')}`;
                    
                    if (els.gold22) {
                        let gold22 = Math.round(parseInt(price) * 22 / 24);
                        els.gold22.textContent = `₹${gold22.toLocaleString('en-IN')}`;
                    }
                }

                if (silverMatch && els.silver) {
                    let price = silverMatch[1].replace(/,/g, '');
                    els.silver.textContent = `₹${parseInt(price).toLocaleString('en-IN')}`;
                }

                document.getElementById('update-time').textContent = 
                    `Last updated: ${new Date().toLocaleTimeString('en-IN')}`;

            } catch (err) {
                console.error(err);
                Object.values(els).forEach(el => {
                    if (el) el.textContent = "Unable to load";
                });
                document.getElementById('update-time').textContent = "Error - Try Refresh";
            }
        }

        // Initial load + auto refresh
        window.onload = () => {
            fetchPrices();
            setInterval(fetchPrices, 600000); // 10 minutes
        };
    </script>
</body>
</html>
