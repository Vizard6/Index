<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gold Silver Prices India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2.5em; margin-bottom: 20px; }
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .price-card {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .price-display { font-size: 2.5em; font-weight: bold; color: #667eea; margin: 10px 0; }
        button {
            padding: 15px 40px;
            font-size: 1.1em;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Live Gold & Silver Prices India</h1>
        <p>Real-time Rates</p>

        <div class="price-grid">
            <div class="price-card">
                <h2>Gold 24K (10g)</h2>
                <div id="gold24" class="price-display">₹1,40,500</div>
            </div>
            <div class="price-card">
                <h2>Gold 22K (10g)</h2>
                <div id="gold22" class="price-display">₹1,28,800</div>
            </div>
            <div class="price-card">
                <h2>Silver (1kg)</h2>
                <div id="silver" class="price-display">₹2,21,700</div>
            </div>
        </div>

        <button onclick="alert('Prices updated! (Demo Mode)')">🔄 Refresh Prices Now</button>
        <p>Last updated: Just now</p>
    </div>
</body>
</html>
