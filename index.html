<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gold Silver Prices India | 22K 24K Gold Rate | Silver Price</title>
    <meta name="description" content="Check live gold and silver prices in India. Get real-time 22K, 24K gold rates per 10g and silver prices per kg across major cities.">
    <meta name="keywords" content="gold price today, silver price India, 22K gold, 24K gold, Mumbai gold rate, Delhi gold price">
    <link rel="canonical" href="https://yourusername.github.io/gold-silver-prices/">
   
    <style>
        /* Your original beautiful styles - unchanged */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 15px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .subtitle { text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 30px; font-size: 1.1em; }
        .info-banner {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .price-card {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.3s;
        }
        .price-card:hover { transform: translateY(-5px); }
        .icon { font-size: 50px; margin-bottom: 15px; }
        .card-title { font-size: 1.5em; color: #333; font-weight: 600; margin-bottom: 5px; }
        .card-subtitle { font-size: 0.9em; color: #666; margin-bottom: 20px; }
        .price-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        .loading { color: #999; font-style: italic; font-size: 1.1em; }
        .error { color: #e74c3c; }
        .update-time { text-align: center; color: white; margin: 20px 0 40px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .refresh-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .refresh-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Live Gold & Silver Prices India</h1>
        <p class="subtitle">Real-time 22K, 24K Gold Rate & Silver Price Updates</p>
       
        <div class="info-banner">
            📊 Powered by GoldAPI.io • Auto-updates every 10 minutes
        </div>

        <div class="price-grid">
            <article class="price-card">
                <div class="icon">🥇</div>
                <h2 class="card-title">Gold 24K</h2>
                <p class="card-subtitle">Per 10 Grams</p>
                <div id="gold24-price" class="price-display loading">Loading...</div>
            </article>
            <article class="price-card">
                <div class="icon">🏆</div>
                <h2 class="card-title">Gold 22K</h2>
                <p class="card-subtitle">Per 10 Grams</p>
                <div id="gold22-price" class="price-display loading">Loading...</div>
            </article>
            <article class="price-card">
                <div class="icon">🥈</div>
                <h2 class="card-title">Silver</h2>
                <p class="card-subtitle">Per 1 Kilogram</p>
                <div id="silver-price" class="price-display loading">Loading...</div>
            </article>
        </div>

        <!-- Your existing city section, FAQ, footer, share buttons remain the same -->
        <!-- ... paste them here if needed ... -->

        <button class="refresh-btn" onclick="fetchLivePrices()">🔄 Refresh Prices Now</button>
        <div class="update-time" id="update-time">Loading latest prices...</div>
    </div>

    <script>
        const API_KEY = "goldapi-698f98b47300144a107816957eb89e25-io";   // ← Get free from https://www.goldapi.io/

        async function fetchLivePrices() {
            if (!API_KEY || API_KEY === "goldapi-698f98b47300144a107816957eb89e25-io") {
                alert("Please replace YOUR_API_KEY_HERE with your actual GoldAPI.io key");
                return;
            }

            const loadingElements = document.querySelectorAll('.price-display');
            loadingElements.forEach(el => el.textContent = "Updating...");

            try {
                // === Gold 24K ===
                const goldRes = await fetch('https://www.goldapi.io/api/XAU/INR', {
                    headers: { 'x-access-token': API_KEY }
                });
                const goldData = await goldRes.json();

                if (goldData.price) {
                    const pricePer10g24k = (goldData.price_gram_24k * 10).toFixed(2);
                    document.getElementById('gold24-price').textContent = `₹${Number(pricePer10g24k).toLocaleString('en-IN')}`;

                    // 22K calculation
                    const price22k = (pricePer10g24k * 22 / 24).toFixed(2);
                    document.getElementById('gold22-price').textContent = `₹${Number(price22k).toLocaleString('en-IN')}`;
                }

                // === Silver ===
                const silverRes = await fetch('https://www.goldapi.io/api/XAG/INR', {
                    headers: { 'x-access-token': API_KEY }
                });
                const silverData = await silverRes.json();

                if (silverData.price) {
                    // Convert ounce price to per kg (1 kg = 32.1507 troy ounces)
                    const pricePerKg = (silverData.price * 32.1507).toFixed(0);
                    document.getElementById('silver-price').textContent = `₹${Number(pricePerKg).toLocaleString('en-IN')}`;
                }

                // Update timestamp
                document.getElementById('update-time').textContent = 
                    `Last updated: ${new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}`;

            } catch (error) {
                console.error(error);
                document.querySelectorAll('.price-display').forEach(el => {
                    el.textContent = "Failed to load";
                    el.classList.add('error');
                });
            }
        }

        // Load prices on page open + every 10 minutes
        window.onload = () => {
            fetchLivePrices();
            setInterval(fetchLivePrices, 600000); // 10 minutes
        };
    </script>
</body>
</html>
