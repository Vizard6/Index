<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gold Silver Prices India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5em; margin-bottom: 10px; }
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .price-card {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .price-display { font-size: 2.5em; font-weight: bold; color: #667eea; margin: 10px 0; }
        .refresh-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Live Gold & Silver Prices India</h1>

        <div class="price-grid">
            <div class="price-card">
                <h2>Gold 24K</h2>
                <p>Per 10 Grams</p>
                <div id="gold24" class="price-display">Loading...</div>
            </div>
            <div class="price-card">
                <h2>Gold 22K</h2>
                <p>Per 10 Grams</p>
                <div id="gold22" class="price-display">Loading...</div>
            </div>
            <div class="price-card">
                <h2>Silver</h2>
                <p>Per 1 Kilogram</p>
                <div id="silver" class="price-display">Loading...</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="fetchPrices()">🔄 Refresh Prices Now</button>
        <div id="update-time"></div>
    </div>

    <script>
        async function fetchPrices() {
            const els = {
                gold24: document.getElementById('gold24'),
                gold22: document.getElementById('gold22'),
                silver: document.getElementById('silver')
            };

            Object.values(els).forEach(el => el.textContent = "Updating...");

            // Manual realistic Indian prices (you can update these daily if needed)
            const gold24_10g = 140500;
            const silverKg = 221700;

            els.gold24.textContent = `₹${gold24_10g.toLocaleString('en-IN')}`;
            els.gold22.textContent = `₹${Math.round(gold24_10g * 22 / 24).toLocaleString('en-IN')}`;
            els.silver.textContent = `₹${silverKg.toLocaleString('en-IN')}`;

            document.getElementById('update-time').textContent = `Last updated: ${new Date().toLocaleTimeString('en-IN')}`;
        }

        window.onload = fetchPrices;
        setInterval(fetchPrices, 600000);
    </script>
</body>
</html>
