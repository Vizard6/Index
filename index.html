<script>
    const API_KEY = "A7TV8RGC4DOKZNH5GPRF490H5GPRF";
    
    // Higher premium to match Indian market
    const GOLD_PREMIUM = 1.135;   // ~13.5% premium
    const SILVER_PREMIUM = 1.25;  // ~25% premium

    async function fetchLivePrices() {
        const displays = {
            gold24: document.getElementById('gold24-price'),
            gold22: document.getElementById('gold22-price'),
            silver: document.getElementById('silver-price')
        };

        Object.values(displays).forEach(el => {
            el.textContent = "Updating...";
            el.classList.remove('error');
        });

        try {
            const res = await fetch(`https://api.metals.dev/v1/latest?api_key=${API_KEY}&currency=INR`);
            const data = await res.json();

            if (data.metals) {
                // Gold 24K per 10g
                const goldGramSpot = data.metals.gold / 31.1035;
                let gold24_10g = Math.round(goldGramSpot * 10 * GOLD_PREMIUM);
                displays.gold24.textContent = `₹${gold24_10g.toLocaleString('en-IN')}`;

                // Gold 22K
                let gold22_10g = Math.round(gold24_10g * 22 / 24);
                displays.gold22.textContent = `₹${gold22_10g.toLocaleString('en-IN')}`;

                // Silver per kg
                const silverGramSpot = data.metals.silver / 31.1035;
                let silverKg = Math.round(silverGramSpot * 1000 * SILVER_PREMIUM);
                displays.silver.textContent = `₹${silverKg.toLocaleString('en-IN')}`;
            }

            document.getElementById('update-time').innerHTML = 
                `Last updated: ${new Date().toLocaleTimeString('en-IN')} <small>(Adjusted for Indian Market)</small>`;

        } catch (error) {
            console.error(error);
            Object.values(displays).forEach(el => {
                el.textContent = "Failed";
                el.classList.add('error');
            });
        }
    }

    window.onload = () => {
        fetchLivePrices();
        setInterval(fetchLivePrices, 600000);
    };
</script>
